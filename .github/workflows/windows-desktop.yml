name: Windows x64 desktop build

on:
  workflow_dispatch:
  push:
    branches: [main, arena/677099b2-bubu]
    paths:
      - 'frontend/**'
      - '.github/workflows/windows-desktop.yml'

jobs:
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Package Windows x64
        shell: pwsh
        run: |
          cmd /c "npm run dist:win > build-log.txt 2>&1"
          Get-Content build-log.txt -Tail 35
          if ($LASTEXITCODE -ne 0) {
            $errorText = ((Get-Content build-log.txt -Tail 20) -join ' ') -replace '%', '%25' -replace '\r', '%0D' -replace '\n', '%0A'
            Write-Output "::error title=Windows packaging failed::$errorText"
            exit 1
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: icmn-partner-windows-x64
          path: frontend/release/*.exe
          if-no-files-found: error
